<h1>USUARIOS</h1>


<!--BOTON AGREGAR USUARIO-->
<div class="row d-flex justify-content-end" style="margin-bottom:10px;">
  <button type="button" id="btnAgregar" class="btn btn-dark" (click)="addUser()"><i class="fa fa-plus" id="iconoAgregar" aria-hidden="true"></i></button>
</div>

<div class="row">

  <table class="table" style="width:100%;" id="table">
    <thead class="table-dark">

      <!-- Titulo -->
      <tr>
        <td colspan="7" style="text-align: center; padding: 10px;">
          LISTADO DE USUARIOS
        </td>
      </tr>

      <!-- Cabecera de los campos -->
      <tr class="text-center">
        <th style="padding:10px;">ID</th>
        <th style="padding:10px;">NOMBRE</th>
        <th style="padding:10px;">EMAIL</th>
        <th style="padding:10px;">TELÉFONO</th>
        <th style="padding:10px;">PASSWORD</th>
        <th style="padding:10px;">F. ALTA</th>
        <th style="padding:10px;">ACCIONES</th>
      </tr>

      <!-- Filas de usuarios -->
      <tr *ngFor="let usuario of usuarios">
        <td style="padding:10px;" class="text-center">{{ usuario.idUsuario }}</td>
        <td style="padding:10px;" class="text-center">{{ usuario.nombreUsuario }}</td>
        <td style="padding:10px;" class="text-center">{{ usuario.email }}</td>
        <td style="padding:10px;" class="text-center">{{ usuario.telefono }}</td>
        <td style="padding:10px;" class="text-center">{{ usuario.password }}</td>
        <td style="padding:10px;" class="text-center">{{ usuario.fechaAlta | date:'dd/MM/yyyy' }}</td>

        <td style="padding:10px;" class="text-center">

          <button type="button"
                  class="btn btn-warning"
                  style="margin-right: 10px;"
                  (click)="editUser()">
            <i class="fa fa-pencil" aria-hidden="true"></i>
          </button>

          <button type="button"
                  class="btn btn-warning"
                  (click)="deleteUser()">
            <i class="fa fa-times" aria-hidden="true"></i>
          </button>

        </td>
      </tr>

    </thead>
  </table>
</div>


<!--
  VENTANAS MODALES HIJAS:
  - [abrir]: Comunicación PADRE -> HIJO. Envía true cuando pulsamos el botón para abrir el modal.
  - (cerrar): Comunicación HIJO -> PADRE. El hijo emite este evento al pulsar 'Cancelar' o la 'X'.
    Ejecutamos '= false' para apagar el interruptor del padre; si no lo reseteamos a false,
    el padre seguiría pensando que está abierto y no nos dejaría volver a abrirlo una segunda vez.
  - (usuarioAgregado): Comunicación HIJO -> PADRE. Se dispara cuando el usuario se guarda en la BD,
    y el padre llama a getUsers() para recargar la tabla automáticamente.
-->

<!-- Modal para Crear / Añadir Usuario -->
<app-anadir-usuario [abrir]="modalAgregarUsuario" 
                    (cerrar)="modalAgregarUsuario = false"
                    (usuarioAgregado)="getUsers()">
</app-anadir-usuario>

<!-- Modal para Editar / Modificar Usuario -->
<app-modificar-usuario [abrir]="modalModificarUsuario" (cerrar)="modalModificarUsuario = false"></app-modificar-usuario>

<!-- Modal para Borrar / Eliminar Usuario -->
<app-eliminar-usuario [abrir]="modalEliminarUsuario" (cerrar)="modalEliminarUsuario = false"></app-eliminar-usuario>
